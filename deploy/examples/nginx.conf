# Reference nginx config — NOT for Plesk.
# Plesk generates and manages its own nginx/Apache configuration; do not
# copy this into a Plesk server. Kept only as a reference for a manually
# administered Ubuntu + nginx host. See docs/PLESK-DEPLOY.md for Plesk.
# /etc/nginx/sites-available/mdnaime
# Replace server_name, root and the PHP-FPM socket for your server.

server {
    listen 80;
    listen [::]:80;
    server_name mdnaime.design www.mdnaime.design;
    return 301 https://mdnaime.design$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mdnaime.design;

    root /var/www/mdnaime/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/mdnaime.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdnaime.design/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    charset utf-8;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
}
