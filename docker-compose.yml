services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdnaime-portfolio-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mdnaime-portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-portfolio_secret}
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  dbdata:
